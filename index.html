
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Beyond the Distance ♡</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=Dancing+Script:wght@500;600;700&display=swap');

:root {
  --pink:#ef9dbb;
  --pink2:#ffd5e4;
  --cream:#fff9f3;
  --ink:#59434e;
  --muted:#987e89;
  --glass:rgba(255,255,255,.76);
}
*{box-sizing:border-box}
body{
  margin:0; min-height:100vh;
  font-family:'Be Vietnam Pro',sans-serif;
  color:var(--ink);
  background:
    radial-gradient(ellipse at 15% 10%,#ffe2ed 0,transparent 42%),
    radial-gradient(ellipse at 85% 90%,#ffe9d7 0,transparent 42%),
    linear-gradient(135deg,#fff9f4,#fff0f6);
  overflow-x:hidden;
}
button,input,textarea{font:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible{
  outline:3px solid #e88bb0;outline-offset:3px
}
#sky{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
.floating{
  position:absolute;bottom:-35px;opacity:.55;
  animation:floatUp linear forwards;pointer-events:none
}
@keyframes floatUp{
  to{transform:translateY(-115vh) rotate(30deg);opacity:0}
}
header,.app{position:relative;z-index:1}
header{
  display:flex;justify-content:space-between;align-items:center;
  padding:18px clamp(16px,5vw,60px);gap:12px
}
.logo{font-weight:800;letter-spacing:2px;font-size:12px}
.logo span{color:#db85a8}
.music{
  border:1px solid #f2c6d6;background:#ffffffb8;
  border-radius:30px;padding:10px 15px;color:var(--ink)
}
.app{width:min(760px,92%);margin:20px auto 65px}
.progress-wrap{margin:0 auto 20px}
.progress-label{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-bottom:8px}
.progress{height:6px;border-radius:10px;background:#f4dce5;overflow:hidden}
.progress>div{height:100%;width:0;background:linear-gradient(90deg,#ee9fbd,#e9b99a);transition:width .5s}
.screen{
  background:var(--glass);border:1px solid #ffffffd9;
  border-radius:28px;padding:clamp(22px,5vw,45px);
  box-shadow:0 20px 65px #bd8b9b18,0 3px 12px #bd8b9b0d;
  backdrop-filter:blur(15px);
  animation:appear .55s ease both;
}
@keyframes appear{from{opacity:0;transform:translateY(14px) scale(.99)}to{opacity:1;transform:none}}
.center{text-align:center}
.eyebrow{font-size:11px;letter-spacing:3px;color:#d182a2;font-weight:700}
h1,h2,h3,p{margin-top:0}
h1{font-size:clamp(28px,6vw,48px);line-height:1.2;margin:15px 0}
h2{font-size:clamp(23px,4vw,32px);line-height:1.3}
p{line-height:1.85}
.script{font-family:'Dancing Script',cursive;color:#d67fa3;font-size:clamp(30px,6vw,45px)}
.muted{color:var(--muted);font-size:14px}
.emoji{font-size:58px;margin:12px 0}
.primary,.secondary,.choice,.tile,.flower,.card{
  border:0;transition:transform .18s,box-shadow .18s,background .18s
}
.primary{
  padding:14px 24px;border-radius:30px;color:white;font-weight:700;
  background:linear-gradient(120deg,#e992b4,#edb6a9);
  box-shadow:0 8px 20px #e992b43b
}
.primary:hover,.secondary:hover,.choice:hover{transform:translateY(-2px)}
.secondary{
  padding:12px 18px;border-radius:25px;background:white;
  color:var(--ink);border:1px solid #f1d7e1
}
.actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:25px}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:20px 0}
.choice{
  background:#fff8fb;border:1px solid #f2d9e3;border-radius:17px;
  padding:16px 8px;color:var(--ink);min-height:75px
}
.choice:hover,.choice.selected{background:#ffe5ef;border-color:#e89bb8}
.status{min-height:28px;text-align:center;color:#c8799a;font-size:13px;margin:10px 0}
.gamebox{
  border:1px solid #f3dce5;background:#fff9fc;
  border-radius:20px;padding:18px;margin:18px 0
}
.game-stat{display:flex;justify-content:space-between;gap:10px;font-size:13px;color:var(--muted)}
input,textarea{
  width:100%;padding:13px 15px;border-radius:13px;
  border:1px solid #edcedb;background:#fffdfd;color:var(--ink);
  margin:7px 0 12px
}
textarea{min-height:115px;resize:vertical}
.heart-board{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;min-height:100px;align-items:center}
.heart-target{font-size:35px;border:0;background:none;padding:5px;transition:transform .15s}
.heart-target:hover{transform:scale(1.2)}
.flower-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.flower{background:#fff;border:1px solid #f3dce5;border-radius:16px;padding:18px 5px;font-size:30px}
.memory-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.card{aspect-ratio:1;border-radius:14px;background:#fbe5ed;color:#cf80a0;font-size:25px}
.card.open,.card.matched{background:#fff;color:var(--ink);border:1px solid #f1c7d8}
.card.matched{opacity:.6}
.wheel{
  width:min(270px,75vw);aspect-ratio:1;border-radius:50%;margin:15px auto;
  background:conic-gradient(#ffd9e6 0 45deg,#fff3d9 45deg 90deg,#f6c7d8 90deg 135deg,#fff 135deg 180deg,#f7d8e5 180deg 225deg,#ffeddc 225deg 270deg,#f4bfd4 270deg 315deg,#fff7ee 315deg);
  border:7px solid white;box-shadow:0 5px 25px #d79bb633;
  display:grid;place-items:center;font-size:38px;transition:transform 1.3s cubic-bezier(.1,.7,.1,1)
}
.puzzle{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;max-width:330px;margin:18px auto}
.puzzle button{aspect-ratio:1;border:0;border-radius:12px;background:#f8dce7;color:#8d536c;font-size:25px;font-weight:700}
.puzzle button.blank{background:#fff8fb}
.bubbles{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;min-height:110px}
.bubble{width:52px;height:52px;border:1px solid #f1b9d0;border-radius:50%;background:linear-gradient(135deg,#ffe4f0,#fff);font-size:22px}
.chapter-list{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;margin-top:20px}
.chapter{display:flex;align-items:center;gap:11px;text-align:left;padding:13px;border:1px solid #f2dce5;border-radius:15px;background:#fff9fc;color:var(--ink)}
.chapter small{display:block;color:var(--muted);margin-top:4px}
.chapter .num{font-size:21px}
.letter{
  background:linear-gradient(145deg,#fffdf8,#fff3f6);
  border:1px solid #f0d7df;border-radius:5px;padding:clamp(18px,5vw,35px);
  box-shadow:0 7px 22px #b9809410;text-align:left
}
.letter p{white-space:pre-line}
footer{text-align:center;color:#b194a0;font-size:11px;margin-top:24px}
@media(max-width:500px){
  header{padding:15px}.app{margin-top:12px}
  .grid{gap:7px}.choice{font-size:12px;padding:12px 4px}
  .chapter-list{grid-template-columns:1fr}
  .screen{border-radius:22px}
}
</style>
</head>
<body>
<div id="sky"></div>
<header>
  <div class="logo">BEYOND <span>THE DISTANCE ♡</span></div>
  <button class="music" id="musicBtn">♫ Bật nhạc</button>
</header>

<main class="app">
  <div class="progress-wrap" id="progressWrap" hidden>
    <div class="progress-label"><span id="progressName">HÀNH TRÌNH</span><span id="progressCount">0/14</span></div>
    <div class="progress"><div id="progressBar"></div></div>
  </div>
  <section class="screen" id="screen"></section>
  <footer>made with a little courage & a lot of sincerity ♡</footer>
</main>

<script>
const $=s=>document.querySelector(s);
const screen=$('#screen');
const chapters=[
 ['Pinky Catch','Bắt những trái tim'],
 ['Flower Garden','Khu vườn nhỏ'],
 ['Sweet Memory','Ghép cặp dễ thương'],
 ['Guess My Birthday','Đoán sinh nhật tớ'],
 ['Find the Kitty','Tìm mèo con'],
 ['Lucky Wheel','Vòng quay may mắn'],
 ['Puzzle Love','Ghép tranh trái tim'],
 ['Little Quiz','Câu đố nhỏ'],
 ['Tiny Claw','Máy gắp quà'],
 ['Bubble Pop','Bong bóng niềm vui'],
 ['Little Journal','Nhật ký nhỏ'],
 ['Secret Date','Mật mã ngày sinh'],
 ['The Apology','Lá thư xin lỗi'],
 ['One Last Wish','Điều ước cuối']
];
let unlocked=0,done=new Set(),musicOn=false,audioCtx=null,musicTimer=null;
let cleanup=null;

function renderProgress(i){
 $('#progressWrap').hidden=false;
 $('#progressName').textContent=chapters[i][0].toUpperCase();
 $('#progressCount').textContent=`${done.size}/14`;
 $('#progressBar').style.width=(done.size/14*100)+'%';
}
function render(html,i=null){
 if(cleanup){cleanup();cleanup=null}
 if(i!==null)renderProgress(i);
 screen.innerHTML=html;
 screen.scrollIntoView({behavior:'smooth',block:'start'});
}
function btn(label,fn,cls='primary'){
 const b=document.createElement('button');b.className=cls;b.textContent=label;b.onclick=fn;return b;
}
function actions(...buttons){
 const d=document.createElement('div');d.className='actions';
 buttons.forEach(b=>d.appendChild(b));return d;
}
function msg(t){const el=$('#status');if(el)el.textContent=t}
function markDone(i){
 done.add(i);unlocked=Math.max(unlocked,i+1);
 $('#progressCount').textContent=`${done.size}/14`;
 $('#progressBar').style.width=(done.size/14*100)+'%';
}
function reward(i,text){
 markDone(i);
 render(`<div class="center"><div class="emoji">🌷</div><div class="eyebrow">CHAPTER COMPLETED</div><h2>Giỏi lắm, cậu!</h2><p>${text}</p><p class="script">Một chút dịu dàng gửi đến cậu ♡</p></div>`,i);
 screen.appendChild(actions(
  btn(i===13?'Xem kết thúc':'Chương tiếp theo →',()=>openChapter(Math.min(i+1,13))),
  btn('Bản đồ chương',showMap,'secondary')
 ));
}
function start(){
 $('#progressWrap').hidden=true;
 render(`<div class="center">
  <div class="eyebrow">A LITTLE JOURNEY FOR YOU</div>
  <div class="emoji">💌</div>
  <h1>Beyond the<br><span class="script">Distance</span></h1>
  <p>Có một điều tớ muốn nói với cậu.<br>Nhưng trước tiên, cùng chơi vài trò nho nhỏ nhé?</p>
  <p class="muted">14 chương · mini game · một lá thư nhỏ</p>
  <div class="actions" id="startActions"></div>
  <p class="muted" style="margin-top:24px;font-size:12px">11/07/2026</p>
 </div>`);
 $('#startActions').append(btn('Bắt đầu hành trình ♡',()=>openChapter(0)));
}
function showMap(){
 if(cleanup){cleanup();cleanup=null}
 render(`<div class="eyebrow">YOUR LITTLE JOURNEY</div><h2>Bản đồ hành trình 🌸</h2><p class="muted">Chọn một chương đã mở khóa để chơi lại nhé.</p><div class="chapter-list" id="chapterList"></div>`);
 const list=$('#chapterList');
 chapters.forEach((c,i)=>{
  const b=document.createElement('button');b.className='chapter';
  b.disabled=i>unlocked;
  b.style.opacity=i>unlocked?'.42':'1';
  b.innerHTML=`<span class="num">${i<done.size&&done.has(i)?'💗':i>unlocked?'🔒':'🌷'}</span><span><b>${String(i+1).padStart(2,'0')}. ${c[0]}</b><small>${c[1]}</small></span>`;
  b.onclick=()=>openChapter(i);list.appendChild(b);
 });
 screen.appendChild(actions(btn('Về trang đầu',start,'secondary')));
}
function openChapter(i){
 if(i>unlocked){showMap();return}
 switch(i){
 case 0: pinkyCatch(i);break;
 case 1: flowerGarden(i);break;
 case 2: memoryGame(i);break;
 case 3: birthday(i);break;
 case 4: kitty(i);break;
 case 5: luckyWheel(i);break;
 case 6: puzzleGame(i);break;
 case 7: littleQuiz(i);break;
 case 8: clawGame(i);break;
 case 9: bubblePop(i);break;
 case 10: journal(i);break;
 case 11: secretDate(i);break;
 case 12: apology(i);break;
 case 13: finalWish(i);break;
 }
}

/* 01 — BẮT TRÁI TIM */
function pinkyCatch(i){
 let score=0,ended=false;
 render(`<div class="eyebrow">CHAPTER 01 · PINKY CATCH</div><h2>Bắt lấy những trái tim 💗</h2>
 <p>Nhấn vào trái tim để thu thập đủ 10 trái tim nhé. Không cần vội đâu!</p>
 <div class="gamebox"><div class="game-stat"><span>Trái tim</span><b id="score">0 / 10</b></div><div class="heart-board" id="heartBoard"></div></div><div class="status" id="status"></div>`,i);
 const board=$('#heartBoard');
 function fill(){
  board.innerHTML='';
  ['💗','💖','💕','💝','💓','💘'].sort(()=>Math.random()-.5).slice(0,5).forEach((h,j)=>{
   const b=btn(h,()=>{
    if(ended)return;score++;$('#score').textContent=`${score} / 10`;
    if(score>=10){ended=true;reward(i,'Cậu đã thu thập đủ trái tim rồi. Có những điều nhỏ bé cũng đủ làm một ngày dịu dàng hơn.');}
    else{msg('Một trái tim nữa nè! ♡');fill()}
   },'heart-target');board.appendChild(b);
  });
 }
 fill();
}

/* 02 — VƯỜN HOA */
function flowerGarden(i){
 render(`<div class="eyebrow">CHAPTER 02 · FLOWER GARDEN</div><h2>Tặng mình một bó hoa nhé 🌷</h2>
 <p>Chọn 3 bông hoa cậu thích nhất để tạo một bó hoa nhỏ.</p><div class="flower-grid" id="flowers"></div><div class="status" id="status">Đã chọn 0/3 bông hoa</div>`,i);
 const choices=['🌷','🌸','🌼','🌹','🪻','🌻','🌺','💐','🌱'];let picked=[];
 const box=$('#flowers');
 choices.forEach(f=>{
  const b=btn(f,()=>{
   if(picked.includes(f)){picked=picked.filter(x=>x!==f);b.classList.remove('selected')}
   else if(picked.length<3){picked.push(f);b.classList.add('selected')}
   msg(`Đã chọn ${picked.length}/3 bông hoa`);
   if(picked.length===3){
    const bouquet=picked.join(' ');
    render(`<div class="center"><div class="eyebrow">YOUR FLOWER BOUQUET</div><div class="emoji">${bouquet}</div><h2>Một bó hoa dành cho cậu</h2><p>Không cần dịp đặc biệt mới có thể tặng ai đó một điều dễ thương.</p></div>`,i);
    screen.appendChild(actions(btn('Nhận bó hoa ♡',()=>reward(i,'Mong rằng hôm nay của cậu có thêm một chút niềm vui.'))));
   }
  },'flower');box.appendChild(b);
 });
}

/* 03 — GHÉP CẶP */
function memoryGame(i){
 const symbols=['🐱','🌷','🍓','🎀','🌙','🧸','🍒','💗'];
 let deck=[...symbols,...symbols].sort(()=>Math.random()-.5),open=[],matched=new Set(),moves=0,lock=false;
 render(`<div class="eyebrow">CHAPTER 03 · SWEET MEMORY</div><h2>Ghép những cặp giống nhau</h2><p>Lật hai thẻ mỗi lượt. Tìm đủ 8 cặp là thắng!</p>
 <div class="game-stat"><span>Lượt đi</span><b id="moves">0</b><span>Đã ghép</span><b id="pairs">0/8</b></div><div class="gamebox"><div class="memory-grid" id="memory"></div></div><div class="status" id="status"></div>`,i);
 const grid=$('#memory');
 function draw(){
  grid.innerHTML='';
  deck.forEach((v,n)=>{
   const b=btn(matched.has(n)?v:open.includes(n)?v:'♡',()=>{
    if(lock||matched.has(n)||open.includes(n))return;
    open.push(n);draw();
    if(open.length===2){
     moves++;$('#moves').textContent=moves;
     if(deck[open[0]]===deck[open[1]]){
      open.forEach(k=>matched.add(k));open=[];$('#pairs').textContent=`${matched.size/2}/8`;draw();
      if(matched.size===16)reward(i,'Cậu tìm được hết những cặp giống nhau rồi. Đôi khi điều nhỏ bé nhất lại khiến ta mỉm cười.');
     }else{
      lock=true;const previous=[...open];
      const timer=setTimeout(()=>{open=[];lock=false;draw()},650);
      cleanup=()=>clearTimeout(timer);
     }
    }
   },'card');
   if(open.includes(n))b.classList.add('open');
   if(matched.has(n))b.classList.add('matched');
   grid.appendChild(b);
  });
 }
 draw();
}

/* 04 — ĐOÁN SINH NHẬT TỚ */
function birthday(i){
 render(`<div class="center"><div class="eyebrow">CHAPTER 04 · GUESS MY BIRTHDAY</div><div class="emoji">🎂</div><h2>Cậu có nhớ sinh nhật tớ không?</h2>
 <p>Chọn ngày và tháng cậu đoán nhé. Nếu chưa đúng, tớ sẽ bật mí một chút!</p></div>
 <div class="gamebox"><label>Ngày</label><select id="birthDay" style="width:100%;padding:13px;border:1px solid #edcedb;border-radius:12px;background:white;color:#59434e"></select>
 <label>Tháng</label><select id="birthMonth" style="width:100%;padding:13px;border:1px solid #edcedb;border-radius:12px;background:white;color:#59434e"></select></div><div class="status" id="status"></div><div id="birthdayActions" class="actions"></div>`,i);
 for(let d=1;d<=31;d++)$('#birthDay').add(new Option(String(d).padStart(2,'0'),d));
 for(let m=1;m<=12;m++)$('#birthMonth').add(new Option(String(m).padStart(2,'0'),m));
 $('#birthdayActions').append(btn('Đoán thử ♡',()=>{
  const d=+$('#birthDay').value,m=+$('#birthMonth').value;
  if(d===21&&m===4){
   render(`<div class="center"><div class="emoji">🎉🎂💗</div><h2>Đúng rồi!</h2><p>Sinh nhật tớ là <b>21/04</b> đó.</p><p>Cậu nhớ được thì tớ vui lắm, còn nếu không nhớ cũng không sao đâu :))</p></div>`,i);
   screen.appendChild(actions(btn('Mở quà sinh nhật',()=>reward(i,'Chiếc bánh nhỏ này dành cho cậu — người vừa vượt qua thử thách sinh nhật của tớ!'))));
  }else{
   msg('Chưa đúng rồi :)) Gợi ý: tháng sinh của tớ là tháng 4, thử lại nhé!');
  }
 }));
}

/* 05 — TÌM MÈO */
function kitty(i){
 let found=false;
 render(`<div class="eyebrow">CHAPTER 05 · FIND THE KITTY</div><h2>Mèo con đang trốn đâu nhỉ? 🐱</h2><p>Nhấn vào các ô để tìm mèo. Cậu có 6 lượt tìm nhé!</p>
 <div class="grid" id="kittyGrid"></div><div class="status" id="status">Còn 6 lượt tìm</div>`,i);
 const target=Math.floor(Math.random()*9);let tries=6;
 const g=$('#kittyGrid');
 for(let n=0;n<9;n++){
  const b=btn('🌿',()=>{
   if(found||b.dataset.used)return;
   b.dataset.used='1';tries--;
   if(n===target){
    found=true;b.textContent='🐱';
    render(`<div class="center"><div class="emoji">🐱</div><h2>Tìm thấy mèo con rồi!</h2><p>Nó đang trốn ở đây chờ cậu đó.</p></div>`,i);
    screen.appendChild(actions(btn('Vuốt ve mèo con ♡',()=>reward(i,'Mèo con đã được tìm thấy! Chương này chỉ cần một chút kiên nhẫn thôi.'))));
   }else{b.textContent=['🌸','🍓','🧸','✨'][Math.floor(Math.random()*4)];msg(`Chưa phải rồi! Còn ${tries} lượt.`);if(tries===0)msg('Hết lượt rồi, nhưng cậu có thể thử lại.');}
  },'choice');g.appendChild(b);
 }
 screen.appendChild(actions(btn('Chơi lại',()=>kitty(i),'secondary')));
}

/* 06 — VÒNG QUAY */
function luckyWheel(i){
 render(`<div class="eyebrow">CHAPTER 06 · LUCKY WHEEL</div><h2>Vòng quay may mắn 🎡</h2><p>Quay một vòng xem hôm nay cậu nhận được món quà nào nhé.</p>
 <div class="wheel" id="wheel">🎁</div><div class="status" id="status">Sẵn sàng chưa nào?</div><div class="actions" id="wheelActions"></div>`,i);
 const prizes=['Một bông hoa 🌷','Một chiếc kẹo 🍬','Một trái tim 💗','Một lời chúc ✨','Một món quà 🎁','Một cái ôm từ xa 🧸'];
 let spinning=false;
 $('#wheelActions').append(btn('Quay nào!',()=>{
  if(spinning)return;spinning=true;
  $('#wheel').style.transform=`rotate(${1440+Math.random()*720}deg)`;
  setTimeout(()=>{spinning=false;const prize=prizes[Math.floor(Math.random()*prizes.length)];msg('Cậu nhận được: '+prize);$('#wheelActions').innerHTML='';$('#wheelActions').append(btn('Nhận quà ♡',()=>reward(i,'Phần quà của cậu là: '+prize+'. Mong cậu luôn có những điều nhỏ bé để vui.')))},1400);
 }));
}

/* 07 — GHÉP TRANH */
function puzzleGame(i){
 let board=[1,2,3,4,5,6,7,8,0];
 for(let k=0;k<100;k++){
  const z=board.indexOf(0),opts=[z-3,z+3,...(z%3?[z-1]:[]),...(z%3<2?[z+1]:[])].filter(x=>x>=0&&x<9&&Math.abs(Math.floor(x/3)-Math.floor(z/3))+Math.abs(x%3-z%3)===1);
  const n=opts[Math.floor(Math.random()*opts.length)];[board[z],board[n]]=[board[n],board[z]];
 }
 let moves=0;
 render(`<div class="eyebrow">CHAPTER 07 · PUZZLE LOVE</div><h2>Ghép những mảnh tranh</h2><p>Chạm ô cạnh ô trống để đưa các số về đúng thứ tự. Cậu có thể chơi thoải mái.</p><div class="game-stat"><span>Số lượt</span><b id="moves">0</b></div><div class="puzzle" id="puzzle"></div><div class="status" id="status"></div>`,i);
 const g=$('#puzzle');
 function draw(){
  g.innerHTML='';
  board.forEach((v,n)=>{
   const b=btn(v===0?'♡':v,()=>{
    if(v===0)return;
    const z=board.indexOf(0);
    if(Math.abs(Math.floor(n/3)-Math.floor(z/3))+Math.abs(n%3-z%3)!==1)return;
    [board[z],board[n]]=[board[n],board[z]];moves++;$('#moves').textContent=moves;draw();
    if(board.every((x,j)=>x===(j+1)%9))reward(i,'Cậu đã ghép hoàn chỉnh bức tranh. Từng chút một, mọi thứ lại về đúng vị trí.');
   },'');
   if(v===0)b.classList.add('blank');
   g.appendChild(b);
  });
 }
 draw();
}

/* 09 — MÁY GẮP QUÀ */
function clawGame(i){
 let tries=3;
 render(`<div class="eyebrow">CHAPTER 09 · TINY CLAW</div><h2>Máy gắp quà 🧸</h2><p>Chọn một hộp quà để thử vận may. Cậu có 3 lần gắp!</p><div class="grid" id="claw"></div><div class="status" id="status">Còn 3 lượt</div>`,i);
 const prizes=['🧸','🎀','🍓','💗','🌷','🎁'];
 prizes.sort(()=>Math.random()-.5).forEach(prize=>{
  const b=btn('🎁',()=>{
   if(tries<=0||b.dataset.open)return;
   b.dataset.open='1';b.textContent=prize;tries--;
   msg(`Cậu gắp được ${prize}! Còn ${tries} lượt.`);
   if(tries===0||$('#claw').querySelectorAll('[data-open="1"]').length>=2){
    $('#claw').querySelectorAll('button').forEach(x=>x.disabled=true);
    screen.appendChild(actions(btn('Nhận quà',()=>reward(i,'Không quan trọng món quà lớn hay nhỏ, điều quan trọng là niềm vui khi mở nó.'))));
   }
  },'choice');$('#claw').appendChild(b);
 });
}

 for(let n=0;n<total;n++){

/* Nhạc piano tạo bằng Web Audio API */
let noteIndex=0;
const notes=[261.63,329.63,392,329.63,293.66,349.23,440,349.23];
function playNote(freq,duration=.65){
 if(!audioCtx||!musicOn)return;
 const osc=audioCtx.createOscillator(),gain=audioCtx.createGain();
 osc.type='sine';osc.frequency.value=freq;
 gain.gain.setValueAtTime(.0001,audioCtx.currentTime);
 gain.gain.exponentialRampToValueAtTime(.075,audioCtx.currentTime+.04);
 gain.gain.exponentialRampToValueAtTime(.0001,audioCtx.currentTime+duration);
 osc.connect(gain);gain.connect(audioCtx.destination);
 osc.start();osc.stop(audioCtx.currentTime+duration+.03);
}
function musicLoop(){
 if(!musicOn)return;
 playNote(notes[noteIndex%notes.length],.7);
 if(noteIndex%4===0)playNote(notes[(noteIndex+2)%notes.length]/2,1.3);
 noteIndex++;
 musicTimer=setTimeout(musicLoop,650);
}
async function toggleMusic(){
 try{
  if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();
  if(audioCtx.state==='suspended')await audioCtx.resume();
  musicOn=!musicOn;
  $('#musicBtn').textContent=musicOn?'♫ Tắt nhạc':'♫ Bật nhạc';
  if(musicOn)musicLoop();else clearTimeout(musicTimer);
 }catch(e){$('#musicBtn').textContent='Không phát được nhạc';}
}
$('#musicBtn').addEventListener('click',toggleMusic);
start();
</script>
